[project]
name = "remporte"
version = "0.4.1"
description = "Répondre à un appel d'offres avec votre agent IA : lecture du DCE, analyse, plan, rédaction, relecture, export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "markdown>=3.6",
]

[project.scripts]
remporte = "remporte.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remporte"]
